# Tool configuration only — the project is run from the repo root as
# `python -m src.<module>`, not installed as a package.

[project]
name = "cdm-anomaly-explanation"
version = "0.1.0"
description = "Glass-box anomaly detection and constrained-LLM explanation for ISDA CDM trade-lifecycle traces"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["archive", "results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src", "eval", "experiments", "scripts", "examples"]
