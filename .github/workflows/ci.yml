name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -v

      - name: Smoke-test data generator + demo
        run: |
          python -m src.data_generator --seed 42 --n-normal 50 --n-per-anomaly 5 --out /tmp/data/
          test -f /tmp/data/normal.jsonl
          test -f /tmp/data/anomalies.jsonl
          python -m src.demo --no-llm > /dev/null
